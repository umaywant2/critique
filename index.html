<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Critique — Submit Your Idea</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #000000;
      --bg-alt: #0a0a0a;
      --text: #ffffff;
      --text-dim: #cccccc;

      --accent: #7fb3ff; /* RTT/1 structural hint */
      --radius: 10px;
      --font: "Inter", "Segoe UI", system-ui, sans-serif;
      --shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #111111, #000000);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shell {
      max-width: 720px;
      width: 100%;
      padding: 2.5rem 2rem;
      background: var(--bg-alt);
      border-radius: var(--radius);
      border: 1px solid #222222;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 2.4rem;
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin-bottom: 2rem;
      color: var(--text-dim);
      font-size: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      border-radius: var(--radius);
      border: 1px solid #333333;
      background: #111111;
      color: var(--text);
      font-size: 1rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: #000000;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .routes {
      margin-top: 2rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .route {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      background: #111111;
      color: var(--text-dim);
      font-size: 0.85rem;
      text-decoration: none;
      border: 1px solid #222222;
    }

    .route span.dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
  </style>
</head>

<body>
  <main class="shell">
    <h1>Critique</h1>
    <div class="subtitle">Submit your idea. Get clarity.</div>

    <form>
      <label for="title">Idea Title</label>
      <input id="title" type="text" placeholder="Name your idea…" />

      <label for="summary">Idea Summary</label>
      <textarea id="summary" rows="4" placeholder="Describe your idea in 1–3 sentences…"></textarea>

      <label for="intent">Intent</label>
      <textarea id="intent" rows="3" placeholder="What does your idea want to achieve?"></textarea>

      <button type="submit">Generate Clarity Packet</button>
    </form>

    <section class="routes">
      <a class="route" href="https://gradient.vip" target="_blank">
        <span class="dot"></span>
        Gradient — Alignment Layer
      </a>
      <a class="route" href="https://lumen.rtt1.online" target="_blank">
        <span class="dot"></span>
        RTT/1 — Structural Engine
      </a>
      <a class="route" href="https://hephaestus.rtt2.online" target="_blank">
        <span class="dot"></span>
        RTT/2 — Regime Mapping
      </a>
      <a class="route" href="https://aurion.rtt3.online" target="_blank">
        <span class="dot"></span>
        RTT/3 — Topology Engine
      </a>
      <a class="route" href="https://harmonia.rtt12.online" target="_blank">
        <span class="dot"></span>
        RTT/12 — Unified Synthesis
      </a>
    </section>
  </main>
</body>
</html>
